name: kosta-tickets-back

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-1234}:1234"
    environment:
      - DATABASE_URL=${GATEWAY_DATABASE_URL:-postgresql://gateway:gateway@users_db:5432/kosta_users}
      - MEDIA_PATH=${MEDIA_PATH:-/app/media}
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-http://localhost:1234}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:1236}
      - TICKETS_SERVICE_URL=${TICKETS_SERVICE_URL:-http://tickets:1235}
      - NOTIFICATIONS_SERVICE_URL=${NOTIFICATIONS_SERVICE_URL:-http://notifications:1237}
      - INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL:-http://inventory:1238}
      - TODOS_SERVICE_URL=${TODOS_SERVICE_URL:-http://todos:1240}
      - TIME_TRACKING_SERVICE_URL=${TIME_TRACKING_SERVICE_URL:-http://time_tracking:1241}
      - EXPENSES_SERVICE_URL=${EXPENSES_SERVICE_URL:-http://expenses:1242}
      - ATTENDANCE_SERVICE_URL=${ATTENDANCE_SERVICE_URL:-http://attendance:1239}
      - VACATION_SERVICE_URL=${VACATION_SERVICE_URL:-http://vacation:1244}
      - CALL_SCHEDULE_SERVICE_URL=${CALL_SCHEDULE_SERVICE_URL:-http://call_schedule:1245}
      - CHAT_SERVICE_URL=${CHAT_SERVICE_URL:-http://chat:1246}
      - CONTACTS_SERVICE_URL=${CONTACTS_SERVICE_URL:-http://contacts:1248}
      - CORRESPONDENCE_SERVICE_URL=${CORRESPONDENCE_SERVICE_URL:-http://correspondence:1249}
      - SMART_HOME_SERVICE_URL=${SMART_HOME_SERVICE_URL:-http://host.docker.internal:8765}
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL:-postgresql://gateway:gateway@users_db:5432/kosta_users}
      - TICKETS_DATABASE_URL=${TICKETS_DATABASE_URL:-postgresql://tickets:tickets@tickets_db:5432/kosta_tickets}
      - NOTIFICATIONS_DATABASE_URL=${NOTIFICATIONS_DATABASE_URL:-postgresql://notifications:notifications@notifications_db:5432/kosta_notifications}
      - INVENTORY_DATABASE_URL=${INVENTORY_DATABASE_URL:-postgresql://inventory:inventory@inventory_db:5432/kosta_inventory}
      - ATTENDANCE_DATABASE_URL=${ATTENDANCE_DATABASE_URL:-postgresql://attendance:attendance@attendance_db:5432/kosta_attendance}
      - TODOS_DATABASE_URL=${TODOS_DATABASE_URL:-postgresql://todos:todos@todos_db:5432/kosta_todos}
      - TIME_TRACKING_DATABASE_URL=${TIME_TRACKING_DATABASE_URL:-postgresql://time_tracking:time_tracking@time_tracking_db:5432/kosta_time_tracking}
      - EXPENSES_DATABASE_URL=${EXPENSES_DATABASE_URL:-postgresql://expenses:expenses@expenses_db:5432/kosta_expenses}
      - VACATION_DATABASE_URL=${VACATION_DATABASE_URL:-postgresql://vacation:vacation@vacation_db:5432/kosta_vacation}
      - CHAT_DATABASE_URL=${CHAT_DATABASE_URL:-postgresql://chat:chat@chat_db:5432/kosta_chat}
      - CORRESPONDENCE_DATABASE_URL=${CORRESPONDENCE_DATABASE_URL:-postgresql://correspondence:correspondence@correspondence_db:5432/kosta_correspondence}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ATTENDANCE_HIKVISION_ALLOWED_IPS=${ATTENDANCE_HIKVISION_ALLOWED_IPS:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - CORS_ALLOW_PRIVATE_NETWORK=${CORS_ALLOW_PRIVATE_NETWORK:-true}
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env or stack env (openssl rand -hex 32; same on gateway and auth)}
      # Prod: unique *_DB_PASSWORD / REDIS_PASSWORD+REDIS_URL / WS_INTERNAL_SECRET — see .env.example (rotation ≠ wipe).
      - OPS_DATABASES_ENABLED=${OPS_DATABASES_ENABLED:-true}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      - AUTH_SET_SESSION_COOKIE=${AUTH_SET_SESSION_COOKIE:-true}
      - AUTH_SESSION_COOKIE_NAME=${AUTH_SESSION_COOKIE_NAME:-kl_access_token}
      - AUTH_SESSION_COOKIE_SECURE=${AUTH_SESSION_COOKIE_SECURE:-true}
      - AUTH_SESSION_COOKIE_SAMESITE=${AUTH_SESSION_COOKIE_SAMESITE:-lax}
    volumes:
      - media_storage:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:1234/live\", timeout=3)"' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      users_db:
        condition: service_healthy
      auth:
        condition: service_healthy
      tickets:
        condition: service_started
      notifications:
        condition: service_started
      inventory:
        condition: service_started
      todos:
        condition: service_started
      time_tracking:
        condition: service_started
      expenses:
        condition: service_started
      attendance:
        condition: service_started
      vacation:
        condition: service_started
      call_schedule:
        condition: service_started
      chat:
        condition: service_started
      contacts:
        condition: service_started
      correspondence:
        condition: service_started

  contacts:
    build:
      context: .
      dockerfile: contacts/Dockerfile
    restart: unless-stopped
    environment:
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:1236}
      - TIME_TRACKING_SERVICE_URL=${TIME_TRACKING_SERVICE_URL:-http://time_tracking:1241}
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:1248/health\", timeout=3)"' ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      auth:
        condition: service_healthy
      time_tracking:
        condition: service_started

  correspondence:
    build:
      context: .
      dockerfile: correspondence/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${CORRESPONDENCE_DATABASE_URL:-postgresql://correspondence:correspondence@correspondence_db:5432/kosta_correspondence}
      - MEDIA_PATH=${MEDIA_PATH:-/app/media}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:1236}
      - CORRESPONDENCE_MAX_FILE_BYTES=${CORRESPONDENCE_MAX_FILE_BYTES:-15728640}
      - LOG_LEVEL=${CORRESPONDENCE_LOG_LEVEL:-info}
    volumes:
      - media_storage:/app/media
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:1249/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    depends_on:
      correspondence_db:
        condition: service_healthy
      auth:
        condition: service_started

  correspondence_db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: [ "postgres", "-c", "log_min_messages=warning" ]
    environment:
      POSTGRES_USER: ${CORRESPONDENCE_DB_USER:-correspondence}
      POSTGRES_PASSWORD: ${CORRESPONDENCE_DB_PASSWORD:-correspondence}
      POSTGRES_DB: ${CORRESPONDENCE_DB_NAME:-kosta_correspondence}
    volumes:
      - correspondence_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backup:
    profiles:
      - backup
    build:
      context: .
      dockerfile: backup/Dockerfile
    restart: unless-stopped
    environment:
      BACKUP_ROOT: /backups
      MEDIA_PATH: /media
      BACKUP_MEDIA: ${BACKUP_MEDIA:-true}
      BACKUP_SCHEDULE_CRON: ${BACKUP_SCHEDULE_CRON:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_RETENTION_MIN_COUNT: ${BACKUP_RETENTION_MIN_COUNT:-14}
      BACKUP_API_TOKEN: ${BACKUP_API_TOKEN:-}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://gateway:gateway@users_db:5432/kosta_users}
      TICKETS_DATABASE_URL: ${TICKETS_DATABASE_URL:-postgresql://tickets:tickets@tickets_db:5432/kosta_tickets}
      TODOS_DATABASE_URL: ${TODOS_DATABASE_URL:-postgresql://todos:todos@todos_db:5432/kosta_todos}
      NOTIFICATIONS_DATABASE_URL: ${NOTIFICATIONS_DATABASE_URL:-postgresql://notifications:notifications@notifications_db:5432/kosta_notifications}
      INVENTORY_DATABASE_URL: ${INVENTORY_DATABASE_URL:-postgresql://inventory:inventory@inventory_db:5432/kosta_inventory}
      ATTENDANCE_DATABASE_URL: ${ATTENDANCE_DATABASE_URL:-postgresql://attendance:attendance@attendance_db:5432/kosta_attendance}
      TIME_TRACKING_DATABASE_URL: ${TIME_TRACKING_DATABASE_URL:-postgresql://time_tracking:time_tracking@time_tracking_db:5432/kosta_time_tracking}
      EXPENSES_DATABASE_URL: ${EXPENSES_DATABASE_URL:-postgresql://expenses:expenses@expenses_db:5432/kosta_expenses}
      VACATION_DATABASE_URL: ${VACATION_DATABASE_URL:-postgresql://vacation:vacation@vacation_db:5432/kosta_vacation}
      CHAT_DATABASE_URL: ${CHAT_DATABASE_URL:-postgresql://chat:chat@chat_db:5432/kosta_chat}
      CORRESPONDENCE_DATABASE_URL: ${CORRESPONDENCE_DATABASE_URL:-postgresql://correspondence:correspondence@correspondence_db:5432/kosta_correspondence}
    volumes:
      - backup_storage:/backups
      - media_storage:/media:ro
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:1247/live\", timeout=3)"' ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      users_db:
        condition: service_healthy
      tickets_db:
        condition: service_healthy
      todos_db:
        condition: service_healthy
      notifications_db:
        condition: service_healthy
      inventory_db:
        condition: service_healthy
      attendance_db:
        condition: service_healthy
      time_tracking_db:
        condition: service_healthy
      expenses_db:
        condition: service_healthy
      vacation_db:
        condition: service_healthy
      chat_db:
        condition: service_healthy
      correspondence_db:
        condition: service_healthy

  call_schedule:
    build:
      context: .
      dockerfile: call_schedule/Dockerfile
    restart: unless-stopped
    environment:
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:1236}
      - AUTH_SESSION_COOKIE_NAME=${AUTH_SESSION_COOKIE_NAME:-kl_access_token}
      - CALL_SCHEDULE_MAILBOX=${CALL_SCHEDULE_MAILBOX:-info@kostalegal.com}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - CALL_SCHEDULE_MICROSOFT_TENANT_ID=${CALL_SCHEDULE_MICROSOFT_TENANT_ID:-}
      - CALL_SCHEDULE_MICROSOFT_CLIENT_ID=${CALL_SCHEDULE_MICROSOFT_CLIENT_ID:-}
      - CALL_SCHEDULE_MICROSOFT_CLIENT_SECRET=${CALL_SCHEDULE_MICROSOFT_CLIENT_SECRET:-}
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:1245/health\", timeout=3)"' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      auth:
        condition: service_healthy

  chat:
    build:
      context: .
      dockerfile: chat/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${CHAT_DATABASE_URL:-postgresql://chat:chat@chat_db:5432/kosta_chat}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:1236}
      - CHAT_PUSH_URL=${CHAT_PUSH_URL:-http://gateway:1234/api/v1/chat/internal/push}
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET:-}
      - MEDIA_PATH=${MEDIA_PATH:-/app/media}
      - MAX_FILE_BYTES=${CHAT_MAX_FILE_BYTES:-15728640}
    volumes:
      - media_storage:/app/media
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:1246/health\", timeout=3)"' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      chat_db:
        condition: service_healthy
      auth:
        condition: service_healthy

  chat_db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: [ "postgres", "-c", "log_min_messages=warning" ]
    environment:
      POSTGRES_USER: ${CHAT_DB_USER:-chat}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-chat}
      POSTGRES_DB: ${CHAT_DB_NAME:-kosta_chat}
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  users_db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: [ "postgres", "-c", "log_min_messages=warning" ]
    environment:
      POSTGRES_USER: ${USERS_DB_USER:-gateway}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-gateway}
      POSTGRES_DB: ${USERS_DB_NAME:-kosta_users}
    volumes:
      - users_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  tickets:
    build:
      context: .
      dockerfile: tickets/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${TICKETS_DATABASE_URL:-postgresql://tickets:tickets@tickets_db:5432/kosta_tickets}
      - MEDIA_PATH=${MEDIA_PATH:-/app/media}
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET:-}
    volumes:
      - media_storage:/app/media
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:1235/health\", timeout=3)"' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      tickets_db:
        condition: service_healthy

  tickets_db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: [ "postgres", "-c", "log_min_messages=warning" ]
    environment:
      POSTGRES_USER: ${TICKETS_DB_USER:-tickets}
      POSTGRES_PASSWORD: ${TICKETS_DB_PASSWORD:-tickets}
      POSTGRES_DB: ${TICKETS_DB_NAME:-kosta_tickets}
    volumes:
      - tickets_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${AUTH_DATABASE_URL:-postgresql://gateway:gateway@users_db:5432/kosta_users}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AUTH_REDIRECT_URI=${AUTH_REDIRECT_URI:-${AZURE_REDIRECT_URI:-${GATEWAY_BASE_URL:-http://localhost:1234}/api/v1/auth/azure/callback}}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env or stack env (openssl rand -hex 32; same on gateway and auth)}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      - AUTH_SET_SESSION_COOKIE=${AUTH_SET_SESSION_COOKIE:-true}
      - AUTH_SESSION_COOKIE_NAME=${AUTH_SESSION_COOKIE_NAME:-kl_access_token}
      - AUTH_SESSION_COOKIE_SECURE=${AUTH_SESSION_COOKIE_SECURE:-true}
      - AUTH_SESSION_COOKIE_SAMESITE=${AUTH_SESSION_COOKIE_SAMESITE:-lax}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - AUTH_MAX_CONCURRENT_SESSIONS=${AUTH_MAX_CONCURRENT_SESSIONS:-2}
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET:-}
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:1236/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 90s
    depends_on:
      users_db:
        condition: service_healthy

  notifications:
    build:
      context: .
      dockerfile: notifications/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${NOTIFICATIONS_DATABASE_URL:-postgresql://notifications:notifications@notifications_db:5432/kosta_notifications}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:1236}
      - MEDIA_PATH=${MEDIA_PATH:-/app/media}
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET:-}
    volumes:
      - media_storage:/app/media
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:1237/health\", timeout=3)"' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      notifications_db:
        condition: service_healthy

  notifications_db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: [ "postgres", "-c", "log_min_messages=warning" ]
    environment:
      POSTGRES_USER: ${NOTIFICATIONS_DB_USER:-notifications}
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications}
      POSTGRES_DB: ${NOTIFICATIONS_DB_NAME:-kosta_notifications}
    volumes:
      - notifications_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory:
    build:
      context: .
      dockerfile: inventory/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${INVENTORY_DATABASE_URL:-postgresql://inventory:inventory@inventory_db:5432/kosta_inventory}
      - MEDIA_PATH=${MEDIA_PATH:-/app/media}
    volumes:
      - media_storage:/app/media
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:1238/health\", timeout=3)"' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      inventory_db:
        condition: service_healthy

  inventory_db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: [ "postgres", "-c", "log_min_messages=warning" ]
    environment:
      POSTGRES_USER: ${INVENTORY_DB_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
      POSTGRES_DB: ${INVENTORY_DB_NAME:-kosta_inventory}
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  attendance:
    build:
      context: .
      dockerfile: attendance/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${ATTENDANCE_DATABASE_URL:-postgresql://attendance:attendance@attendance_db:5432/kosta_attendance}
      - MEDIA_PATH=${MEDIA_PATH:-/app/media}
      - HIKVISION_DEVICE_IP=${HIKVISION_DEVICE_IP:-}
      - HIKVISION_DEVICE_IPS=${HIKVISION_DEVICE_IPS:-}
      - HIKVISION_DEVICE_PORT=${HIKVISION_DEVICE_PORT:-80}
      - HIKVISION_DEVICE_USER=${HIKVISION_DEVICE_USER:-admin}
      - HIKVISION_DEVICE_PASSWORD=${HIKVISION_DEVICE_PASSWORD:-}
      - HIKVISION_REQUEST_TIMEOUT=${HIKVISION_REQUEST_TIMEOUT:-60}
    volumes:
      - media_storage:/app/media
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf --max-time 8 http://localhost:1239/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      attendance_db:
        condition: service_healthy

  attendance_db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: [ "postgres", "-c", "log_min_messages=warning" ]
    environment:
      POSTGRES_USER: ${ATTENDANCE_DB_USER:-attendance}
      POSTGRES_PASSWORD: ${ATTENDANCE_DB_PASSWORD:-attendance}
      POSTGRES_DB: ${ATTENDANCE_DB_NAME:-kosta_attendance}
    volumes:
      - attendance_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  todos:
    build:
      context: .
      dockerfile: todos/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${TODOS_DATABASE_URL:-postgresql://todos:todos@todos_db:5432/kosta_todos}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:1236}
      - MEDIA_PATH=${MEDIA_PATH:-/app/media}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-15}
      - NOTIFICATION_PUSH_URL=${NOTIFICATION_PUSH_URL:-http://gateway:1234/api/v1/notifications/system}
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET:-}
      - OUTLOOK_TOKEN_FERNET_KEY=${OUTLOOK_TOKEN_FERNET_KEY:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI:-${GATEWAY_BASE_URL:-http://localhost:1234}/api/v1/todos/calendar/callback}
      - CALENDAR_CONNECTED_REDIRECT_URL=${CALENDAR_CONNECTED_REDIRECT_URL:-${FRONTEND_URL:-http://localhost:5173}}
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:1240/health\", timeout=3)"' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - media_storage:/app/media
    depends_on:
      todos_db:
        condition: service_healthy
      auth:
        condition: service_healthy

  todos_db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: [ "postgres", "-c", "log_min_messages=warning" ]
    environment:
      POSTGRES_USER: ${TODOS_DB_USER:-todos}
      POSTGRES_PASSWORD: ${TODOS_DB_PASSWORD:-todos}
      POSTGRES_DB: ${TODOS_DB_NAME:-kosta_todos}
    volumes:
      - todos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  time_tracking:
    build:
      context: .
      dockerfile: time_tracking/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${TIME_TRACKING_DATABASE_URL:-postgresql://time_tracking:time_tracking@time_tracking_db:5432/kosta_time_tracking}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:1236}
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET:-}
      - TIME_TRACKING_DATABASE_URL=${TIME_TRACKING_DATABASE_URL:-postgresql://time_tracking:time_tracking@time_tracking_db:5432/kosta_time_tracking}
      - EXPENSES_SERVICE_URL=${EXPENSES_SERVICE_URL:-http://expenses:1242}
      - WEEKLY_SUBMIT_TZ=${WEEKLY_SUBMIT_TZ:-Asia/Tashkent}
      - TT_SMTP_HOST=${TT_SMTP_HOST:-${EXPENSE_SMTP_HOST:-}}
      - TT_SMTP_PORT=${TT_SMTP_PORT:-${EXPENSE_SMTP_PORT:-587}}
      - TT_SMTP_USER=${TT_SMTP_USER:-${EXPENSE_SMTP_USER:-}}
      - TT_SMTP_PASSWORD=${TT_SMTP_PASSWORD:-${EXPENSE_SMTP_PASSWORD:-}}
      - TT_SMTP_USE_TLS=${TT_SMTP_USE_TLS:-${EXPENSE_SMTP_USE_TLS:-true}}
      - TT_MAIL_FROM=${TT_MAIL_FROM:-${EXPENSE_MAIL_FROM:-}}
      - TT_NOTIFY_PROJECT_ACCESS_ADDED=${TT_NOTIFY_PROJECT_ACCESS_ADDED:-true}
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:1241/health\", timeout=3)"' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      time_tracking_db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Optional: REDIS_PASSWORD + REDIS_URL=redis://:PASSWORD@redis:6379/0
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    command:
      [
        "/bin/sh",
        "-c",
        'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  time_tracking_celery_worker:
    build:
      context: .
      dockerfile: time_tracking/Dockerfile
    restart: unless-stopped
    command: [ "celery", "-A", "celery_app", "worker", "--loglevel=info" ]
    working_dir: /app
    environment:
      - DATABASE_URL=${TIME_TRACKING_DATABASE_URL:-postgresql://time_tracking:time_tracking@time_tracking_db:5432/kosta_time_tracking}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - WEEKLY_SUBMIT_TZ=${WEEKLY_SUBMIT_TZ:-Asia/Tashkent}
    depends_on:
      redis:
        condition: service_healthy
      time_tracking_db:
        condition: service_healthy
      time_tracking:
        condition: service_started

  time_tracking_celery_beat:
    build:
      context: .
      dockerfile: time_tracking/Dockerfile
    restart: unless-stopped
    command: [ "celery", "-A", "celery_app", "beat", "--loglevel=info" ]
    working_dir: /app
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - WEEKLY_SUBMIT_TZ=${WEEKLY_SUBMIT_TZ:-Asia/Tashkent}
      - WEEKLY_SUBMIT_HOUR=${WEEKLY_SUBMIT_HOUR:-12}
      - WEEKLY_SUBMIT_MINUTE=${WEEKLY_SUBMIT_MINUTE:-0}
      - WEEKLY_SUBMIT_DOW=${WEEKLY_SUBMIT_DOW:-1}
    depends_on:
      redis:
        condition: service_healthy
      time_tracking_celery_worker:
        condition: service_started

  time_tracking_db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: [ "postgres", "-c", "log_min_messages=warning" ]
    environment:
      POSTGRES_USER: ${TIME_TRACKING_DB_USER:-time_tracking}
      POSTGRES_PASSWORD: ${TIME_TRACKING_DB_PASSWORD:-time_tracking}
      POSTGRES_DB: ${TIME_TRACKING_DB_NAME:-kosta_time_tracking}
    volumes:
      - time_tracking_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  expenses:
    build:
      context: .
      dockerfile: expenses/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${EXPENSES_DATABASE_URL:-postgresql://expenses:expenses@expenses_db:5432/kosta_expenses}
      - MEDIA_PATH=${MEDIA_PATH:-/app/media}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:1236}
      - TIME_TRACKING_SERVICE_URL=${TIME_TRACKING_SERVICE_URL:-http://time_tracking:1241}
      - EXPENSE_AMOUNT_LIMIT_UZS=${EXPENSE_AMOUNT_LIMIT_UZS:-}
      - LOG_LEVEL=${EXPENSES_LOG_LEVEL:-info}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - EXPENSE_ALLOW_SELF_MODERATION=${EXPENSE_ALLOW_SELF_MODERATION:-true}
      - EXPENSE_NOTIFY_ON_SUBMIT=${EXPENSE_NOTIFY_ON_SUBMIT:-true}
      - EXPENSE_NOTIFY_TO=${EXPENSE_NOTIFY_TO:-zumerov@kostalegal.com}
      - EXPENSE_NOTIFY_ROUTING_JSON=${EXPENSE_NOTIFY_ROUTING_JSON:-}
      - EXPENSE_SMTP_HOST=${EXPENSE_SMTP_HOST:-}
      - EXPENSE_SMTP_PORT=${EXPENSE_SMTP_PORT:-587}
      - EXPENSE_SMTP_USER=${EXPENSE_SMTP_USER:-}
      - EXPENSE_SMTP_PASSWORD=${EXPENSE_SMTP_PASSWORD:-}
      - EXPENSE_SMTP_USE_TLS=${EXPENSE_SMTP_USE_TLS:-true}
      - EXPENSE_MAIL_FROM=${EXPENSE_MAIL_FROM:-}
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-http://localhost:1234}
      - EXPENSE_EMAIL_ACTION_SECRET=${EXPENSE_EMAIL_ACTION_SECRET:-}
      - EXPENSE_EMAIL_ACTION_TTL_SECONDS=${EXPENSE_EMAIL_ACTION_TTL_SECONDS:-604800}
      - EXPENSE_EMAIL_ACTION_CONFIRM_STEP=${EXPENSE_EMAIL_ACTION_CONFIRM_STEP:-true}
      - EXPENSE_NOTIFY_AUTHOR_ON_DECISION=${EXPENSE_NOTIFY_AUTHOR_ON_DECISION:-true}
      - EXPENSE_AUTH_BEARER_FOR_AUTHOR_EMAIL=${EXPENSE_AUTH_BEARER_FOR_AUTHOR_EMAIL:-}
    volumes:
      - media_storage:/app/media
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:1242/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    depends_on:
      expenses_db:
        condition: service_healthy

  expenses_db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: [ "postgres", "-c", "log_min_messages=warning" ]
    environment:
      POSTGRES_USER: ${EXPENSES_DB_USER:-expenses}
      POSTGRES_PASSWORD: ${EXPENSES_DB_PASSWORD:-expenses}
      POSTGRES_DB: ${EXPENSES_DB_NAME:-kosta_expenses}
    volumes:
      - expenses_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  vacation:
    build:
      context: .
      dockerfile: vacation/Dockerfile
    restart: unless-stopped
    environment:
      - VACATION_USE_EXPLICIT_DATABASE_URL=${VACATION_USE_EXPLICIT_DATABASE_URL:-false}
      - VACATION_DB_USER=${VACATION_DB_USER:-vacation}
      - VACATION_DB_PASSWORD=${VACATION_DB_PASSWORD:-vacation}
      - VACATION_DB_NAME=${VACATION_DB_NAME:-kosta_vacation}
      - VACATION_DB_HOST=${VACATION_DB_HOST:-vacation_db}
      - VACATION_DB_PORT=${VACATION_DB_PORT:-5432}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:1236}
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-http://localhost:1234}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - MEDIA_PATH=${MEDIA_PATH:-/app/media}
      - VACATION_SMTP_HOST=${VACATION_SMTP_HOST:-${EXPENSE_SMTP_HOST:-}}
      - VACATION_SMTP_PORT=${VACATION_SMTP_PORT:-${EXPENSE_SMTP_PORT:-587}}
      - VACATION_SMTP_USER=${VACATION_SMTP_USER:-${EXPENSE_SMTP_USER:-}}
      - VACATION_SMTP_PASSWORD=${VACATION_SMTP_PASSWORD:-${EXPENSE_SMTP_PASSWORD:-}}
      - VACATION_SMTP_USE_TLS=${VACATION_SMTP_USE_TLS:-true}
      - VACATION_MAIL_FROM=${VACATION_MAIL_FROM:-${EXPENSE_MAIL_FROM:-}}
      - VACATION_MAIL_BCC=${VACATION_MAIL_BCC:-}
      - VACATION_EMAIL_ACTION_SECRET=${VACATION_EMAIL_ACTION_SECRET:-}
      - VACATION_EMAIL_ACTION_TTL_SECONDS=${VACATION_EMAIL_ACTION_TTL_SECONDS:-1209600}
      - VACATION_EMAIL_ACTION_CONFIRM_STEP=${VACATION_EMAIL_ACTION_CONFIRM_STEP:-true}
      - VACATION_ANNUAL_ENTITLED_DAYS=${VACATION_ANNUAL_ENTITLED_DAYS:-28}
      - VACATION_MIN_CONTINUOUS_DAYS=${VACATION_MIN_CONTINUOUS_DAYS:-14}
    volumes:
      - media_storage:/app/media
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:1244/health\", timeout=5)"' ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 120s
    depends_on:
      vacation_db:
        condition: service_healthy
      auth:
        condition: service_started

  vacation_db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: [ "postgres", "-c", "log_min_messages=warning" ]
    environment:
      POSTGRES_USER: ${VACATION_DB_USER:-vacation}
      POSTGRES_PASSWORD: ${VACATION_DB_PASSWORD:-vacation}
      POSTGRES_DB: ${VACATION_DB_NAME:-kosta_vacation}
    volumes:
      - vacation_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  telegram_bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}

volumes:
  media_storage:
  backup_storage:
  redis_data:
  users_db_data:
  tickets_db_data:
  notifications_db_data:
  inventory_db_data:
  attendance_db_data:
  todos_db_data:
  time_tracking_db_data:
  expenses_db_data:
  vacation_db_data:
  chat_db_data:
  correspondence_db_data:
