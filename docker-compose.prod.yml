
# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# HTTPS edge (nginx в Docker, если на хосте нет nginx на :443):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile edge up -d edge
services:
  edge:
    profiles: ["edge"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/00-cors-map.conf:/etc/nginx/conf.d/00-cors-map.conf:ro
      - ./deploy/nginx/ticketsback.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    environment:
      - ENVIRONMENT=production
      - CORS_ALLOW_PRIVATE_NETWORK=false
      - FRONTEND_URL=${FRONTEND_URL:-https://tickets.kostalegal.com}
      - ADMIN_FRONTEND_URL=${ADMIN_FRONTEND_URL:-https://tickets.kostalegal.com}
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-https://ticketsback.kostalegal.com}
      - SECURITY_HSTS_ENABLED=${SECURITY_HSTS_ENABLED:-true}
      - CONTACTS_SERVICE_URL=${CONTACTS_SERVICE_URL:-http://contacts:1248}
      - CORRESPONDENCE_SERVICE_URL=${CORRESPONDENCE_SERVICE_URL:-http://correspondence:1249}
      - EXPENSES_SERVICE_URL=${EXPENSES_SERVICE_URL:-http://expenses:1242}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:1236}
      - ATTENDANCE_RANGE_SNAPSHOT_ENABLED=${ATTENDANCE_RANGE_SNAPSHOT_ENABLED:-true}
      - ATTENDANCE_RANGE_SNAPSHOT_REFRESH_SEC=${ATTENDANCE_RANGE_SNAPSHOT_REFRESH_SEC:-600}

  auth:
    environment:
      - FRONTEND_URL=${FRONTEND_URL:-https://tickets.kostalegal.com}
      - ADMIN_FRONTEND_URL=${ADMIN_FRONTEND_URL:-https://tickets.kostalegal.com}
      - AUTH_REDIRECT_URI=${AUTH_REDIRECT_URI:-https://ticketsback.kostalegal.com/api/v1/auth/azure/callback}
      - AUTH_SESSION_COOKIE_SECURE=${AUTH_SESSION_COOKIE_SECURE:-true}

  contacts:
    restart: unless-stopped

  correspondence:
    restart: unless-stopped

  expenses:
    restart: unless-stopped
    environment:
      - FRONTEND_URL=${FRONTEND_URL:-https://tickets.kostalegal.com}

  vacation:
    restart: unless-stopped
    environment:
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-https://ticketsback.kostalegal.com}
      - FRONTEND_URL=${FRONTEND_URL:-https://tickets.kostalegal.com}
      - VACATION_EMAIL_ACTION_SECRET=${VACATION_EMAIL_ACTION_SECRET:-}
