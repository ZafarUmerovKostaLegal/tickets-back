name: kosta-e2e-stack

services:
  users_db:
    extends:
      file: docker-compose.yml
      service: users_db

  tickets_db:
    extends:
      file: docker-compose.yml
      service: tickets_db

  correspondence_db:
    extends:
      file: docker-compose.yml
      service: correspondence_db

  chat_db:
    extends:
      file: docker-compose.yml
      service: chat_db

  auth:
    extends:
      file: docker-compose.yml
      service: auth
    environment:
      AUTH_SESSION_COOKIE_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    depends_on: !override
      users_db:
        condition: service_healthy

  tickets:
    extends:
      file: docker-compose.yml
      service: tickets
    depends_on: !override
      tickets_db:
        condition: service_healthy

  correspondence:
    extends:
      file: docker-compose.yml
      service: correspondence
    depends_on: !override
      correspondence_db:
        condition: service_healthy
      auth:
        condition: service_started

  contacts:
    extends:
      file: docker-compose.yml
      service: contacts
    depends_on: !override
      auth:
        condition: service_healthy

  chat_api:
    build:
      context: .
      dockerfile: chat/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${CHAT_DATABASE_URL:-postgresql://chat:chat@chat_db:5432/kosta_chat}
      - CHAT_DISABLE_DB=0
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:1236}
      - CHAT_PUSH_URL=${CHAT_PUSH_URL:-http://gateway:1234/api/v1/chat/internal/push}
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET:-}
      - MEDIA_PATH=${MEDIA_PATH:-/app/media}
      - MAX_FILE_BYTES=${CHAT_MAX_FILE_BYTES:-15728640}
    volumes:
      - media_storage:/app/media
    depends_on:
      chat_db:
        condition: service_healthy
      auth:
        condition: service_healthy

  gateway:
    extends:
      file: docker-compose.yml
      service: gateway
    ports:
      - "${GATEWAY_PORT:-1234}:1234"
    environment:
      AUTH_SESSION_COOKIE_SECURE: "false"
      ATTENDANCE_RANGE_SNAPSHOT_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CHAT_SERVICE_URL: http://chat_api:1252
    depends_on: !override
      users_db:
        condition: service_healthy
      auth:
        condition: service_healthy
      tickets:
        condition: service_started
      correspondence:
        condition: service_started
      contacts:
        condition: service_started
      chat_api:
        condition: service_started

volumes:
  media_storage:
  users_db_data:
  tickets_db_data:
  correspondence_db_data:
  chat_db_data:
