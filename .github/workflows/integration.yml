name: Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install httpx

      - name: Create .env for compose
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          echo "GATEWAY_PORT=1234" >> .env

      - name: Start E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d --wait --timeout 600

      - name: Pytest integration
        run: pytest tests/integration -q --tb=short -m integration
        env:
          PYTHONPATH: tests
          E2E_GATEWAY_URL: http://localhost:1234

      - name: Pytest E2E full route sweep
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pytest tests/e2e -q --tb=line -m e2e_full -n auto
        env:
          PYTHONPATH: tests
          E2E_FULL: "1"

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
