# Reverse proxy: HTTPS → gateway (docker compose, порт 1234 на хосте).
# Сертификаты: certbot / Let's Encrypt → /etc/letsencrypt/live/ticketsback.kostalegal.com/
#
#   certbot certonly --nginx -d ticketsback.kostalegal.com
#   ln -s /path/to/tickets-back/deploy/nginx/ticketsback.kostalegal.com.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name ticketsback.kostalegal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ticketsback.kostalegal.com;

    ssl_certificate     /etc/letsencrypt/live/ticketsback.kostalegal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticketsback.kostalegal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
