# Upstream gateway для nginx на хосте (не в Docker).
#
# По умолчанию: gateway на том же сервере (docker publish 1234 → localhost).
# После переноса Docker на другой IP замените 127.0.0.1 на IP нового хоста, например:
#   server 192.168.230.81:1234;
#
#   sudo nginx -t && sudo systemctl reload nginx
#
upstream kosta_gateway {
    server 127.0.0.1:1234;
    keepalive 32;
}
