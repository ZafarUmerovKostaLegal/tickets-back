# Разрешённые Origin для CORS (http-контекст nginx).
map $http_origin $cors_allow_origin {
    default "";
    "~^https://([a-z0-9-]+\.)*kostalegal\.com$" $http_origin;
    "http://localhost:5173" $http_origin;
    "http://127.0.0.1:5173" $http_origin;
    "http://localhost:8080" $http_origin;
    "http://127.0.0.1:8080" $http_origin;
    "http://localhost:8081" $http_origin;
    "http://127.0.0.1:8081" $http_origin;
    "http://localhost:5500" $http_origin;
    "http://127.0.0.1:5500" $http_origin;
}
