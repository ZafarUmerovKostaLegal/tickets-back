# Nginx внутри Docker (docker-compose.prod.yml → сервис edge).
# TLS-сертификаты монтируются с хоста: /etc/letsencrypt
# Upstream — gateway в той же docker-сети (не 127.0.0.1).

upstream kosta_gateway {
    server gateway:1234;
    keepalive 32;
}

server {
    listen 80;
    server_name ticketsback.kostalegal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ticketsback.kostalegal.com;

    ssl_certificate     /etc/letsencrypt/live/ticketsback.kostalegal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticketsback.kostalegal.com/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://kosta_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
