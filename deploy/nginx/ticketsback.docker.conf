# Nginx внутри Docker (docker-compose.prod.yml → сервис edge).
# TLS-сертификаты монтируются с хоста: /etc/letsencrypt
# Upstream — gateway в той же docker-сети (не 127.0.0.1).
#
# Snippets: deploy/nginx/snippets/ → /etc/nginx/snippets/

upstream kosta_gateway {
    server gateway:1234;
    keepalive 32;
}

server {
    listen 80;
    server_name ticketsback.kostalegal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ticketsback.kostalegal.com;

    ssl_certificate     /etc/letsencrypt/live/ticketsback.kostalegal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticketsback.kostalegal.com/privkey.pem;

    client_max_body_size 50m;

    # Preflight без проксирования в gateway
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, Cache-Control, Pragma" always;
        add_header Content-Length 0;
        add_header Vary "Origin" always;
        return 204;
    }

    proxy_intercept_errors on;
    error_page 502 503 504 = @gateway_cors_error;

    location @gateway_cors_error {
        internal;
        default_type application/json;
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, Cache-Control, Pragma" always;
        add_header Vary "Origin" always;
        return 504 '{"detail":"Gateway timeout or upstream error"}';
    }

    # Тяжёлый отчёт посещаемости для графика отпусков (месячные чанки)
    location ~ ^/api/v1/attendance/report/range$ {
        include /etc/nginx/snippets/proxy-gateway-base.conf;
        include /etc/nginx/snippets/cors-kostalegal.conf;
        proxy_read_timeout 600s;
        proxy_pass http://kosta_gateway;
    }

    location / {
        include /etc/nginx/snippets/proxy-gateway-base.conf;
        include /etc/nginx/snippets/cors-kostalegal.conf;
        proxy_read_timeout 300s;
        proxy_pass http://kosta_gateway;
    }
}
