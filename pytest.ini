[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = tests
markers =
    unit: unit tests (service logic, no full stack)
    integration: docker-compose stack health checks
    e2e: end-to-end API tests (gateway + services)
    e2e_full: full route sweep (slow; all endpoints)
    workflow: business workflow smoke tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
